openapi: 3.0.3
info:
  title: E-commerce Checkout API
  version: 1.0.0
  description: |
    Demo checkout API with in-memory users, cards, inventory, and orders.
    Cash purchases receive a 10% discount; credit-card purchases receive no discount.
servers:
  - url: http://localhost:3000
paths:
  /register:
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Casey Example
                email:
                  type: string
                  format: email
                  example: casey@example.com
                password:
                  type: string
                  minLength: 8
                  example: ExamplePass123!
      responses:
        "201":
          description: User registered; includes a bearer token.
        "400":
          description: Invalid registration details.
        "409":
          description: Email is already registered.
  /login:
    post:
      summary: Log in and receive a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Authenticated user and bearer token.
        "400":
          description: Missing login details.
        "401":
          description: Invalid email or password.
  /card:
    post:
      summary: Save card metadata for the authenticated user
      description: Only the last four digits are accepted; never send or store a full card number or CVV.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardholderName, last4, expiryMonth, expiryYear]
              properties:
                cardholderName:
                  type: string
                last4:
                  type: string
                  pattern: "^\\d{4}$"
                  example: "4242"
                expiryMonth:
                  type: integer
                  minimum: 1
                  maximum: 12
                expiryYear:
                  type: integer
                  example: 2030
      responses:
        "201":
          description: Card metadata saved.
        "400":
          description: Invalid card metadata.
        "401":
          description: Missing or invalid bearer token.
  /checkout:
    post:
      summary: Create an order
      description: Cash orders receive a 10% discount; credit-card orders receive no discount.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, paymentMethod]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId:
                        type: string
                        example: product-1
                      quantity:
                        type: integer
                        minimum: 1
                paymentMethod:
                  type: string
                  enum: [cash, credit_card]
                cardId:
                  type: string
                  description: Required for credit_card; must belong to the authenticated user.
      responses:
        "201":
          description: Order created with subtotal, discount, and total.
        "400":
          description: Invalid order, payment method, or card.
        "401":
          description: Missing or invalid bearer token.
        "409":
          description: Insufficient inventory.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
